# Trellis (FMA) verification pipeline — the enforcement layer (Section 3.4 of the white paper).
# These gates are what make module agents safe to run on smaller models.
name: trellis-ci
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Boundary lint (module isolation)
        run: pnpm lint

      - name: Contract tests (every module vs @app/contracts)
        run: pnpm -r --filter "./modules/*" test:contract

      - name: Module tests
        run: pnpm -r --filter "./modules/*" test

      - name: Cross-module integration suite (federation-owned)
        run: pnpm test:integration

      - name: Gate 5a — coverage manifest (a vacuous pass is a failure)
        run: pnpm check-coverage   # fails if any MVP UC lacks a spec, or a spec lacks a non-waived Fn / AC / INV test

      - name: Gate 5b — use-case e2e + visual (generated by trellis-visual-qa)
        run: pnpm test:e2e

      - name: Security substrate — dependency audit + secret scan
        run: pnpm audit --audit-level=high && npx --yes gitleaks detect --no-banner --redact || true
        # remove '|| true' once the baseline is clean; it is a warning gate for the first week only
